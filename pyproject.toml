[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-monitor-template"
version = "0.1.0"
description = "A clean-room, rule-based channel monitor template"
requires-python = ">=3.11"

[project.scripts]
tg-monitor = "telegram_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_monitor = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
